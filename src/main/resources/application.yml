spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/devotional}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
telegram:
  bot:
    token: ${TELEGRAM_BOT_TOKEN:}

app:
  llm:
    model: ${APP_LLM_MODEL:openai/gpt-4o-mini}
